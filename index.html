<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cómo jugar a Civitas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Archivo:wght@400;500;700&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
/* Una sola columna para el móvil: cabecera con el perfil de la ciudad creciendo por eras, luego bloques de lectura. */
:root {
  --bg: #eef2f4; --surface: #ffffff; --ink: #172430; --muted: #566572; --line: #d5dde3; --gold: #c9921f; --gold-ink: #2b1d00;
  --sky1: #cfe3ee; --sky2: #eef2f4; --ground: #c7d3c0;
  --a: #e8453c; --b: #f2c230; --c: #2f8fe8;
  --f-display: "Bricolage Grotesque", "Noto Sans TC", system-ui, sans-serif;
  --f-body: "Archivo", "Noto Sans TC", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e151c; --surface: #16212b; --ink: #e8eef2; --muted: #9aabb8; --line: #273541; --gold: #e7b74a; --gold-ink: #2b1d00;
  --sky1: #142838; --sky2: #0e151c; --ground: #1f2b24; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e151c; --surface: #16212b; --ink: #e8eef2; --muted: #9aabb8; --line: #273541; --gold: #e7b74a; --gold-ink: #2b1d00;
  --sky1: #142838; --sky2: #0e151c; --ground: #1f2b24; color-scheme: dark; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--f-body); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
h2 { font-size: 26px; font-weight: 800; letter-spacing: -.01em; line-height: 1.15; }
p { margin: 0; }

/* Cabecera */
.hero { background: linear-gradient(180deg, var(--sky1), var(--sky2)); }
.hero .wrap { padding-block: 22px 0; display: grid; gap: 14px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.langs { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.langs button { font: 600 13px/1 var(--f-body); color: var(--muted); background: none; border: 0; padding: 9px 12px; cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.langs button:focus-visible, .tabs button:focus-visible { outline: 3px solid var(--gold); outline-offset: -3px; }
h1 { font-size: clamp(54px, 17vw, 88px); font-weight: 800; line-height: .9; letter-spacing: -.03em; }
.lead { font-size: 19px; line-height: 1.45; max-width: 30ch; }
.skyline { display: block; width: 100%; height: auto; margin-top: 6px; }
.eras-strip { display: grid; grid-template-columns: repeat(5, 1fr); font-size: 11px; color: var(--muted); text-align: center; padding-block: 6px 18px; font-weight: 600; }

section .wrap { padding-block: 34px; display: grid; gap: 18px; }
section + section .wrap { border-top: 1px solid var(--line); }

/* Pasos */
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 48px 1fr; gap: 14px; align-items: start; }
.steps li::before { counter-increment: s; content: counter(s); display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; background: var(--gold); color: var(--gold-ink); font: 800 22px/1 var(--f-display); }
.steps b { display: block; font-family: var(--f-display); font-size: 19px; margin-bottom: 2px; }
.steps span { color: var(--muted); }
.button-demo { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.bigbtn { flex: none; width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f7dc8f, var(--gold) 70%); box-shadow: 0 4px 0 #8a6414, 0 8px 18px rgba(0,0,0,.18); }
.button-demo p { font-size: 15px; color: var(--muted); }

/* Trivia */
.abc { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; font-weight: 600; }
.opt i { flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; color: #111; font: 900 17px/1 var(--f-display); font-style: normal; box-shadow: inset 0 -3px 0 rgba(0,0,0,.22); }
.opt.ok { border-color: #3fae66; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
.qcard .q { font-family: var(--f-display); font-weight: 600; font-size: 18px; line-height: 1.3; }
.qnote { font-size: 13px; color: var(--muted); }
.facts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.facts li { display: grid; grid-template-columns: 92px 1fr; gap: 12px; align-items: baseline; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
.facts li:last-child { border-bottom: 0; padding-bottom: 0; }
.facts b { font-family: var(--f-display); font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--gold); line-height: 1.1; }
.facts span { color: var(--muted); }

/* Viaje por eras */
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--surface); border: 1px solid var(--line); padding: 5px; border-radius: 14px; }
.tabs button { font: 700 15px/1 var(--f-body); color: var(--muted); background: none; border: 0; border-radius: 10px; padding: 11px 6px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
.timeline li { display: grid; grid-template-columns: 22px 1fr; gap: 14px; position: relative; padding-bottom: 18px; }
.timeline li::after { content: ""; position: absolute; left: 10px; top: 22px; bottom: 0; width: 2px; background: var(--line); }
.timeline li:last-child::after { display: none; }
.dot { width: 22px; height: 22px; border-radius: 50%; background: var(--era); box-shadow: 0 0 0 4px color-mix(in srgb, var(--era) 25%, transparent); margin-top: 2px; }
.timeline h3 { font-size: 20px; font-weight: 800; line-height: 1.2; }
.yrs { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lm { margin-top: 6px; font-size: 15px; }
.lm em { font-style: normal; font-weight: 700; color: var(--ink); background: color-mix(in srgb, var(--era) 22%, transparent); padding: 1px 7px; border-radius: 6px; }

/* La ciudad vive */
.life { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.life div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
.life b { display: block; font-family: var(--f-display); font-size: 16px; margin-bottom: 3px; }
.life span { font-size: 14px; color: var(--muted); line-height: 1.45; display: block; }
footer .wrap { padding-block: 26px 40px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
footer p { color: var(--muted); font-size: 14px; }
footer strong { font-family: var(--f-display); font-size: 20px; color: var(--ink); }
@media (min-width: 560px) { .life { grid-template-columns: repeat(3, 1fr); } }
@media (prefers-reduced-motion: no-preference) { .skyline .rise { transform-box: fill-box; transform-origin: bottom; animation: rise .9s cubic-bezier(.2,.8,.3,1) both; } @keyframes rise { from { transform: scaleY(.2); opacity: 0; } } }
</style>
</head>
<body>


<header class="hero">
  <div class="wrap">
    <div class="top">
      <span class="eyebrow" data-t="eyebrow"></span>
      <div class="langs" role="group" aria-label="Idioma / Language / 語言">
        <button type="button" id="l-es" data-lang="es">ES</button><button type="button" id="l-en" data-lang="en">EN</button><button type="button" id="l-zh" data-lang="zh">中文</button>
      </div>
    </div>
    <h1>Civitas</h1>
    <p class="lead" data-t="lead"></p>
    <svg class="skyline" viewBox="0 0 600 170" role="img" aria-labelledby="skyT">
      <title id="skyT" data-t="skyAlt"></title>
      <rect x="0" y="150" width="600" height="20" fill="var(--ground)"/>
      <!-- Antigua: anfiteatro -->
      <g class="rise" style="animation-delay:.05s" fill="#e7b56a">
        <path d="M20 150 V112 Q70 98 120 112 V150 Z"/>
        <g fill="var(--bg)" opacity=".55"><rect x="32" y="122" width="10" height="16" rx="5"/><rect x="52" y="120" width="10" height="18" rx="5"/><rect x="72" y="120" width="10" height="18" rx="5"/><rect x="92" y="122" width="10" height="16" rx="5"/></g>
      </g>
      <!-- Medieval: catedral -->
      <g class="rise" style="animation-delay:.2s" fill="#d9b25a">
        <rect x="140" y="104" width="70" height="46"/><polygon points="140,104 175,82 210,104"/>
        <rect x="146" y="62" width="16" height="42"/><polygon points="146,62 154,36 162,62"/>
        <rect x="188" y="62" width="16" height="42"/><polygon points="188,62 196,36 204,62"/>
        <circle cx="175" cy="112" r="8" fill="var(--bg)" opacity=".55"/>
      </g>
      <!-- Industrial: torre de hierro -->
      <g class="rise" style="animation-delay:.35s" fill="#e8894a">
        <polygon points="232,150 262,40 266,40 296,150 284,150 264,80 244,150"/>
        <rect x="244" y="112" width="40" height="5"/><rect x="254" y="80" width="20" height="4"/><rect x="263" y="22" width="2" height="20"/>
      </g>
      <!-- Contemporánea: rascacielos -->
      <g class="rise" style="animation-delay:.5s" fill="#63b4ff">
        <rect x="316" y="44" width="34" height="106"/><rect x="354" y="78" width="26" height="72"/><rect x="384" y="96" width="22" height="54"/>
        <g fill="var(--bg)" opacity=".45"><rect x="322" y="52" width="22" height="3"/><rect x="322" y="62" width="22" height="3"/><rect x="322" y="72" width="22" height="3"/><rect x="322" y="82" width="22" height="3"/><rect x="322" y="92" width="22" height="3"/><rect x="322" y="102" width="22" height="3"/><rect x="322" y="112" width="22" height="3"/></g>
      </g>
      <!-- Futura: ascensor orbital -->
      <g class="rise" style="animation-delay:.65s" fill="#2fc7d6">
        <rect x="489" y="0" width="4" height="150"/><ellipse cx="491" cy="58" rx="16" ry="5"/>
        <path d="M430 150 Q445 100 470 104 Q491 70 512 104 Q537 100 552 150 Z"/>
        <circle cx="491" cy="118" r="10" fill="var(--bg)" opacity=".5"/>
      </g>
    </svg>
    <div class="eras-strip" id="erasStrip"></div>
  </div>
</header>

<main>
  <section aria-labelledby="h-how"><div class="wrap">
    <h2 id="h-how" data-t="howT"></h2>
    <div class="button-demo"><div class="bigbtn" aria-hidden="true"></div><p data-t="btnNote"></p></div>
    <ol class="steps">
      <li><div><b data-t="s1t"></b><span data-t="s1"></span></div></li>
      <li><div><b data-t="s2t"></b><span data-t="s2"></span></div></li>
      <li><div><b data-t="s3t"></b><span data-t="s3"></span></div></li>
    </ol>
  </div></section>

  <section aria-labelledby="h-quiz"><div class="wrap">
    <h2 id="h-quiz" data-t="quizT"></h2>
    <p data-t="quizP"></p>
    <div class="qcard" aria-label="Ejemplo">
      <span class="eyebrow" data-t="quizEx"></span>
      <p class="q" data-t="qQ"></p>
      <div class="abc">
        <div class="opt"><i style="background:var(--a)">A</i><span data-t="qA"></span></div>
        <div class="opt ok"><i style="background:var(--b)">B</i><span data-t="qB"></span></div>
        <div class="opt"><i style="background:var(--c)">C</i><span data-t="qC"></span></div>
      </div>
      <p class="qnote" data-t="qNote"></p>
    </div>
    <ul class="facts">
      <li><b>3</b><span data-t="f1"></span></li>
      <li><b>20 s</b><span data-t="f2"></span></li>
      <li><b>+10–30</b><span data-t="f3"></span></li>
    </ul>
  </div></section>

  <section aria-labelledby="h-rw"><div class="wrap">
    <h2 id="h-rw" data-t="rwT"></h2>
    <ul class="facts">
      <li><b>10 · 50 · 100</b><span data-t="r1"></span></li>
      <li><b>25 · 50 · 75</b><span data-t="r2"></span></li>
      <li><b data-t="r3k"></b><span data-t="r3"></span></li>
    </ul>
  </div></section>

  <section aria-labelledby="h-trip"><div class="wrap">
    <h2 id="h-trip" data-t="tripT"></h2>
    <p data-t="tripP"></p>
    <div class="tabs" role="tablist" aria-labelledby="h-trip">
      <button type="button" role="tab" id="t-europa" data-reg="europa"></button><button type="button" role="tab" id="t-america" data-reg="america"></button><button type="button" role="tab" id="t-asia" data-reg="asia"></button>
    </div>
    <ol class="timeline" id="timeline" role="tabpanel"></ol>
  </div></section>

  <section aria-labelledby="h-life"><div class="wrap">
    <h2 id="h-life" data-t="lifeT"></h2>
    <div class="life">
      <div><b data-t="v1t"></b><span data-t="v1"></span></div>
      <div><b data-t="v2t"></b><span data-t="v2"></span></div>
      <div><b data-t="v3t"></b><span data-t="v3"></span></div>
      <div><b data-t="v4t"></b><span data-t="v4"></span></div>
      <div><b data-t="v5t"></b><span data-t="v5"></span></div>
      <div><b data-t="v6t"></b><span data-t="v6"></span></div>
    </div>
  </div></section>
</main>

<footer><div class="wrap">
  <strong data-t="endT"></strong>
  <p data-t="endP"></p>
</div></footer>

<script>
const T = {
  eyebrow: ['Juego colectivo · Exposición', 'Collective game · Exhibition', '集體遊戲 · 展覽'],
  lead: ['Una ciudad que construimos entre todos los visitantes, desde la Antigüedad hasta el futuro.', 'A city built together by every visitor, from Antiquity to the future.', '一座由所有訪客一起建造的城市，從古代一路到未來。'],
  skyAlt: ['Perfil de la ciudad creciendo en cinco eras: anfiteatro, catedral, torre de hierro, rascacielos y ascensor orbital', 'City skyline growing over five ages: amphitheatre, cathedral, iron tower, skyscrapers and space elevator', '城市天際線在五個時代中成長：圓形劇場、大教堂、鐵塔、摩天大樓與軌道電梯'],
  eras: [['Antigua', 'Medieval', 'Industrial', 'Moderna', 'Futura'], ['Ancient', 'Medieval', 'Industrial', 'Modern', 'Future'], ['古代', '中世紀', '工業', '現代', '未來']],
  howT: ['Cómo se juega', 'How to play', '怎麼玩'],

  s1t: ['Pulsa', 'Press', '按下按鈕'],
  s1: ['Cada pulsación trae materiales: piedra, madera, acero, hormigón… según la época. Si pulsáis rápido y seguido, el combo multiplica lo que aportáis.', 'Every press brings materials: stone, timber, steel, concrete… depending on the age. Press fast and keep going, and the combo multiplies what you add.', '每按一次就帶來建材：依時代不同，有石頭、木材、鋼鐵、混凝土……連續快速按，連擊會讓貢獻加倍。'],

  s3t: ['Viaja en el tiempo', 'Travel through time', '穿越時空'],

  lmLabel: ['Gran obra:', 'Landmark:', '地標：'],
  regions: [['Europa', 'América', 'Asia'], ['Europe', 'Americas', 'Asia'], ['歐洲', '美洲', '亞洲']],
  lifeT: ['La ciudad está viva', 'A living city', '活生生的城市'],
  v1t: ['Día y noche', 'Day and night', '日與夜'], v1: ['Amanece y anochece; de noche se encienden farolas y ventanas.', 'The sun rises and sets; at night street lamps and windows light up.', '日出日落；夜裡路燈和窗戶都會亮起。'],
